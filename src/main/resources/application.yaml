spring:
  application:
    name: personal-task-manager-api
  #  jackson:
  #    deserialization:
  #      adjust-dates-to-context-time-zone: false
  security:
    user:
      name: admin
      password: mojehaslo123
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379} # TO-DO: add password in the future
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    #    DB_CLOSE_DELAY: -1
    #    DB_CLOSE_ON_EXIT: FALSE
    #    AUTO_RECONNECT: TRUE
    #    MODE: PostgreSQL
    #    TO-DO: correct database connection
    #    datasource:
    #      url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    defer-datasource-initialization: false
    show-sql: true
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: PUBLIC
  # sql:
  #   init:
  #     mode: always
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    table: flyway_schema_history
    # schemas: app-db
  mail:
    host: ${SMTP_HOST:localhost}
    port: 1025
    username: ${SMTP_MAIL_USERNAME:dummy}
    password: ${SMTP_MAIL_PASSWORD:dummy}
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
server:
  port: 8090
logging:
  level:
    org:
      flywaydb: INFO
rsa:
  public-key: classpath:certs/publickey.pem
  private-key: classpath:certs/privatekey_pkcs8.pem
app:
  mail:
    from: ${SMTP_MAIL_FROM:test@test.com}